name: Build, Test, and Publish Pseudolang

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --verbose

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            kind: native
          - target: x86_64-unknown-linux-gnu
            kind: native
          - target: wasm32-unknown-unknown
            kind: wasm
          - target: wasm32-wasip1
            kind: wasi

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Extract Version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*\"\(.*\)\".*/\1/')" >> $GITHUB_ENV

      - name: Install Cross
        if: matrix.kind == 'native'
        run: cargo install cross

      - name: Install wasm-pack
        if: matrix.target == 'wasm32-unknown-unknown'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # --- Native builds ---

      - name: Build Native
        if: matrix.kind == 'native'
        run: cross build --release --target ${{ matrix.target }} --features native

      - name: Prepare Native Artifacts
        if: matrix.kind == 'native'
        run: |
          mkdir -p release
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            cp target/${{ matrix.target }}/release/fplc.exe release/fplc-x64.exe
          elif [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cp target/${{ matrix.target }}/release/fplc release/fplc-linux-x64
            chmod +x release/fplc-linux-x64
          fi

      # --- Windows installer ---

      - name: Install NSIS
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows Installer
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          mkdir -p release/installer installer
          cp release/fplc-x64.exe installer/fplc.exe
          makensis -DVERSION=${{ env.VERSION }} installer/pseudolang.nsi
          cp release/installer/pseudolang-setup-x64.exe release/

      # --- WASM build ---

      - name: Build WASM
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          wasm-pack build --target web --release -- --features wasm
          mkdir -p release/wasm-bindgen
          cp pkg/fplc_bg.wasm release/wasm-bindgen/
          cp pkg/fplc.js release/wasm-bindgen/
          cp pkg/fplc.d.ts release/wasm-bindgen/
          cp pkg/fplc_bg.wasm.d.ts release/wasm-bindgen/
          cd release && zip -r wasm-bindgen.zip wasm-bindgen/

      # --- WASI build ---

      - name: Build WASI
        if: matrix.kind == 'wasi'
        run: |
          cargo build --release --target wasm32-wasip1 --features wasi
          mkdir -p release
          cp target/wasm32-wasip1/release/fplc.wasm release/fplc-wasi.wasm

      # --- Upload artifacts ---

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pseudolang-${{ matrix.target }}
          path: release/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release
          cp artifacts/pseudolang-x86_64-pc-windows-gnu/fplc-x64.exe release/
          cp artifacts/pseudolang-x86_64-pc-windows-gnu/pseudolang-setup-x64.exe release/ || true
          cp artifacts/pseudolang-x86_64-unknown-linux-gnu/fplc-linux-x64 release/
          cp artifacts/pseudolang-wasm32-wasip1/fplc-wasi.wasm release/ || true
          cp artifacts/pseudolang-wasm32-unknown-unknown/wasm-bindgen.zip release/ || true
          chmod +x release/fplc-linux-x64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pseudolang ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/fplc-x64.exe
            release/fplc-linux-x64
            release/pseudolang-setup-x64.exe
            release/fplc-wasi.wasm
            release/wasm-bindgen.zip
