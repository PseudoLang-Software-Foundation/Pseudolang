name: Build, Test, and Publish Pseudolang

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 16777216

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --verbose

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            kind: native
          - target: x86_64-unknown-linux-gnu
            kind: native
          - target: wasm32-unknown-unknown
            kind: wasm
          - target: wasm32-wasip1
            kind: wasi

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Extract Version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*\"\(.*\)\".*/\1/')" >> $GITHUB_ENV

      - name: Install Cross
        if: matrix.kind == 'native'
        run: cargo install cross

      - name: Install wasm-pack
        if: matrix.target == 'wasm32-unknown-unknown'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # --- Native builds ---

      - name: Build Native
        if: matrix.kind == 'native'
        run: cross build --release --target ${{ matrix.target }} --features native

      - name: Prepare Native Artifacts
        if: matrix.kind == 'native'
        run: |
          mkdir -p dist/release
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            cp target/${{ matrix.target }}/release/fpli.exe dist/release/fpli-x64.exe
          elif [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cp target/${{ matrix.target }}/release/fpli dist/release/fpli-linux-x64
            chmod +x dist/release/fpli-linux-x64
          fi

      # --- Debian package ---

      - name: Build Debian Package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb
          cargo deb --no-build --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/debian/*.deb dist/release/

      # --- Windows installer ---

      - name: Install NSIS
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows Installer
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          mkdir -p dist/release
          cp dist/release/fpli-x64.exe installer/nsis/fpli.exe
          makensis -DVERSION=${{ env.VERSION }} installer/nsis/pseudolang.nsi

      # --- WASM build ---

      - name: Build WASM
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          wasm-pack build --out-dir dist/.tmp --target web --release -- --features wasm
          mkdir -p dist/release/wasm-bindgen
          cp dist/.tmp/fpli_lib_bg.wasm dist/release/wasm-bindgen/
          cp dist/.tmp/fpli_lib.js dist/release/wasm-bindgen/
          cp dist/.tmp/fpli_lib.d.ts dist/release/wasm-bindgen/
          cp dist/.tmp/fpli_lib_bg.wasm.d.ts dist/release/wasm-bindgen/
          cd dist/release && zip -r wasm-bindgen.zip wasm-bindgen/

      # --- WASI build ---

      - name: Build WASI
        if: matrix.kind == 'wasi'
        run: |
          cargo build --release --target wasm32-wasip1 --features wasi
          mkdir -p dist/release
          cp target/wasm32-wasip1/release/fpli.wasm dist/release/fpli.wasm

      # --- Upload artifacts ---

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pseudolang-${{ matrix.target }}
          path: dist/release/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p dist/release
          cp artifacts/pseudolang-x86_64-pc-windows-gnu/fpli-x64.exe dist/release/
          cp artifacts/pseudolang-x86_64-pc-windows-gnu/pseudolang-setup-x64.exe dist/release/ || true
          cp artifacts/pseudolang-x86_64-unknown-linux-gnu/fpli-linux-x64 dist/release/
          cp artifacts/pseudolang-x86_64-unknown-linux-gnu/pseudolang_*.deb dist/release/ || true
          cp artifacts/pseudolang-wasm32-wasip1/fpli.wasm dist/release/ || true
          cp artifacts/pseudolang-wasm32-unknown-unknown/wasm-bindgen.zip dist/release/ || true
          chmod +x dist/release/fpli-linux-x64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pseudolang ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/release/fpli-x64.exe
            dist/release/fpli-linux-x64
            dist/release/pseudolang-setup-x64.exe
            dist/release/fpli.wasm
            dist/release/wasm-bindgen.zip
            dist/release/pseudolang_*.deb
