name: Build, Test, and Publish Pseudolang

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 16777216

jobs:
  # Formatting and lints, once. Cheap, and it fails fast on the things that would
  # otherwise be found by a reviewer rather than by the machine.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # All three supported platforms. Windows matters here specifically: the
      # system-integration and path built-ins take a different code path there
      # (cmd.exe rather than sh, `\` separators, PATHEXT lookup, the `\\?\`
      # verbatim prefix), and cross-compiling the binary proves none of it runs.
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      # `cargo test` covers both targets: the in-process suite in `src/tests/`
      # and the `tests/integration` binary, which drives the built `fpli`
      # executable as a child process.
      - name: Run Tests
        run: cargo test --verbose

  # The WebAssembly targets have their own `cfg` paths -- every host-facing
  # built-in compiles to a "no host" stub there -- so they are type-checked on
  # every push rather than only when a release build happens to exercise them.
  wasm-check:
    name: Check (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-check

      - name: Check Browser WASM
        run: cargo check --target wasm32-unknown-unknown --features wasm --lib

      - name: Check WASI
        run: cargo check --target wasm32-wasip1 --features wasi

  build:
    name: Build (${{ matrix.target }})
    # Gated on the lints as well: a release must not be cut from code that would
    # be rejected by `cargo clippy -D warnings` locally.
    needs: [lint, test]
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            kind: native
          - target: x86_64-unknown-linux-gnu
            kind: native
          - target: aarch64-unknown-linux-gnu
            kind: native
          - target: macos-universal
            kind: darwin
            os: macos-15
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - target: wasm32-unknown-unknown
            kind: wasm
          - target: wasm32-wasip1
            kind: wasi

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Extract Version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*\"\(.*\)\".*/\1/')" >> $GITHUB_ENV

      - name: Install Cross
        if: matrix.kind == 'native'
        run: cargo install cross

      - name: Install wasm-pack
        if: matrix.target == 'wasm32-unknown-unknown'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # --- Native builds ---

      - name: Build Native
        if: matrix.kind == 'native'
        run: cross build --release --target ${{ matrix.target }} --features native

      - name: Prepare Native Artifacts
        if: matrix.kind == 'native'
        run: |
          mkdir -p dist/release
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            cp target/${{ matrix.target }}/release/fpli.exe dist/release/fpli-amd64.exe
          elif [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cp target/${{ matrix.target }}/release/fpli dist/release/fpli-linux-amd64
            chmod +x dist/release/fpli-linux-amd64
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cp target/${{ matrix.target }}/release/fpli dist/release/fpli-linux-arm64
            chmod +x dist/release/fpli-linux-arm64
          fi

      # --- macOS builds ---
      # cross has no darwin images, so these run natively on a macos runner.

      - name: Build macOS arm64
        if: matrix.kind == 'darwin'
        run: cargo build --release --target aarch64-apple-darwin --features native

      - name: Build macOS x86_64
        if: matrix.kind == 'darwin'
        run: cargo build --release --target x86_64-apple-darwin --features native

      - name: Prepare macOS Artifacts
        if: matrix.kind == 'darwin'
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp target/aarch64-apple-darwin/release/fpli dist/release/fpli-macos-arm64
          cp target/x86_64-apple-darwin/release/fpli dist/release/fpli-macos-amd64
          lipo -create \
            dist/release/fpli-macos-arm64 \
            dist/release/fpli-macos-amd64 \
            -output dist/release/fpli-macos-universal
          # lipo copies each slice verbatim, leaving the fat container without a
          # valid signature. arm64 macOS can refuse to exec a Mach-O whose
          # signature is missing or invalidated, so re-sign ad-hoc.
          codesign -s - -f dist/release/fpli-macos-universal
          chmod +x dist/release/fpli-macos-arm64 dist/release/fpli-macos-amd64 dist/release/fpli-macos-universal
          lipo -info dist/release/fpli-macos-universal
          codesign -dv dist/release/fpli-macos-universal
          # Smoke-test the universal binary actually runs on the arm64 runner.
          dist/release/fpli-macos-universal --version
          # upload-artifact strips the executable bit, so the tarball is the real
          # deliverable. COPYFILE_DISABLE stops bsdtar emitting AppleDouble junk.
          cd dist/release
          for f in fpli-macos-arm64 fpli-macos-amd64 fpli-macos-universal; do
            COPYFILE_DISABLE=1 tar -czf "$f.tar.gz" "$f"
            shasum -a 256 "$f.tar.gz" > "$f.tar.gz.sha256"
          done
          ls -l

      # --- Debian package ---

      - name: Build Debian Package
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb
          cargo deb --no-build --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/debian/*.deb dist/release/

      # --- Windows installer ---

      - name: Install NSIS
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows Installer
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: makensis -DVERSION=${{ env.VERSION }} installer/nsis/pseudolang.nsi

      # --- WASM build ---

      - name: Build WASM
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          wasm-pack build --out-dir dist/.tmp --target web --release -- --features wasm
          mkdir -p dist/release/wasm-bindgen
          cp dist/.tmp/fpli_lib_bg.wasm dist/release/wasm-bindgen/
          cp dist/.tmp/fpli_lib.js dist/release/wasm-bindgen/
          cp dist/.tmp/fpli_lib.d.ts dist/release/wasm-bindgen/
          cp dist/.tmp/fpli_lib_bg.wasm.d.ts dist/release/wasm-bindgen/
          cd dist/release && zip -r fpli_lib-wasm-bindgen.zip wasm-bindgen/

      # --- WASI build ---

      - name: Build WASI
        if: matrix.kind == 'wasi'
        run: |
          cargo build --release --target wasm32-wasip1 --features wasi
          mkdir -p dist/release
          cp target/wasm32-wasip1/release/fpli.wasm dist/release/fpli.wasm

      # --- Upload artifacts ---

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pseudolang-${{ matrix.target }}
          path: dist/release/*
          retention-days: 7
          if-no-files-found: error

  vscode-extension:
    name: VSCode Extension
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Verify tmLanguage is current
        run: |
          bash scripts/tm/gen_tmlanguage.sh
          git diff --exit-code utils/tm/pseudolang.tmLanguage.json

      - name: Extract Version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*\"\(.*\)\".*/\1/')" >> $GITHUB_ENV

      - name: Build VSIX
        run: |
          mkdir -p extensions/vscode/syntaxes dist
          cp utils/tm/pseudolang.tmLanguage.json extensions/vscode/syntaxes/
          cp assets/Pseudolang-Logo.png extensions/vscode/icons/icon.png
          sed -i 's/"version": "[^"]*"/"version": "'${{ env.VERSION }}'"/' extensions/vscode/package.json
          cd extensions/vscode
          bun install
          bun run lint
          bun run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: pseudolang-vscode
          path: dist/pseudolang-vscode.vsix
          retention-days: 7

  website:
    name: Website
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Download WASI Artifact
        uses: actions/download-artifact@v4
        with:
          name: pseudolang-wasm32-wasip1
          path: artifacts/wasi

      - name: Prepare Web Assets
        run: |
          bash scripts/tm/gen_tmlanguage.sh
          mkdir -p web/public
          cp artifacts/wasi/fpli.wasm web/public/fpli.wasm
          cp utils/tm/pseudolang.tmLanguage.json web/public/pseudolang.tmLanguage.json

      - name: Build Website
        env:
          ASTRO_BASE: /Pseudolang/
        run: |
          cd web
          bun install
          bun run lint
          bun run build

      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pseudolang-website
          path: web/dist/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: website
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Website Artifact
        uses: actions/download-artifact@v4
        with:
          name: pseudolang-website
          path: web-dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    name: Publish Release
    needs: [build, vscode-extension, website]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p dist/release
          cp artifacts/pseudolang-x86_64-pc-windows-gnu/fpli-amd64.exe dist/release/
          cp artifacts/pseudolang-x86_64-pc-windows-gnu/pseudolang-setup-amd64.exe dist/release/ || true
          cp artifacts/pseudolang-x86_64-unknown-linux-gnu/fpli-linux-amd64 dist/release/
          cp artifacts/pseudolang-x86_64-unknown-linux-gnu/pseudolang_*.deb dist/release/ || true
          cp artifacts/pseudolang-aarch64-unknown-linux-gnu/fpli-linux-arm64 dist/release/
          cp artifacts/pseudolang-aarch64-unknown-linux-gnu/pseudolang_*.deb dist/release/ || true
          # macOS: ship the tarballs (they preserve the exec bit, which
          # upload-artifact strips) plus the bare universal binary.
          cp artifacts/pseudolang-macos-universal/fpli-macos-universal dist/release/
          cp artifacts/pseudolang-macos-universal/fpli-macos-arm64.tar.gz dist/release/
          cp artifacts/pseudolang-macos-universal/fpli-macos-amd64.tar.gz dist/release/
          cp artifacts/pseudolang-macos-universal/fpli-macos-universal.tar.gz dist/release/
          cp artifacts/pseudolang-macos-universal/fpli-macos-arm64.tar.gz.sha256 dist/release/
          cp artifacts/pseudolang-macos-universal/fpli-macos-amd64.tar.gz.sha256 dist/release/
          cp artifacts/pseudolang-macos-universal/fpli-macos-universal.tar.gz.sha256 dist/release/
          cp artifacts/pseudolang-wasm32-wasip1/fpli.wasm dist/release/ || true
          cp artifacts/pseudolang-wasm32-unknown-unknown/fpli_lib-wasm-bindgen.zip dist/release/ || true
          cp artifacts/pseudolang-vscode/pseudolang-vscode.vsix dist/release/ || true
          cd artifacts/pseudolang-website && zip -r ../../dist/release/pseudolang-website.zip . && cd ../..
          chmod +x dist/release/fpli-linux-amd64 dist/release/fpli-linux-arm64 dist/release/fpli-macos-universal

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pseudolang ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/release/fpli-amd64.exe
            dist/release/fpli-linux-amd64
            dist/release/fpli-linux-arm64
            dist/release/fpli-macos-universal
            dist/release/fpli-macos-arm64.tar.gz
            dist/release/fpli-macos-amd64.tar.gz
            dist/release/fpli-macos-universal.tar.gz
            dist/release/fpli-macos-arm64.tar.gz.sha256
            dist/release/fpli-macos-amd64.tar.gz.sha256
            dist/release/fpli-macos-universal.tar.gz.sha256
            dist/release/pseudolang-setup-amd64.exe
            dist/release/fpli.wasm
            dist/release/fpli_lib-wasm-bindgen.zip
            dist/release/pseudolang_*.deb
            dist/release/pseudolang-vscode.vsix
            dist/release/pseudolang-website.zip
