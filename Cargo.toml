# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "fpli"
version = "0.9.610"
edition = "2024"
rust-version = "1.88"
description = "A Pseudolang interpreter written in Rust"
repository = "https://github.com/PseudoLang-Software-Foundation/Pseudolang"
homepage = "https://pseudo-lang.org/"
documentation = "https://docs.rs/fpli"
license = "MIT"
# Must be set explicitly: Cargo's auto-detection only probes "README.md"/"README.txt"/"README",
# so this lowercase file would silently be dropped when publishing from a case-sensitive filesystem.
readme = "readme.md"
keywords = ["pseudocode", "interpreter", "apcsp", "pseudolang", "language"]
categories = [
  "command-line-utilities",
  "compilers",
  "parser-implementations",
  "development-tools",
]
# Allowlist: assets/, web/ and extensions/ are ~85% of the repo and are not needed to
# build (no build.rs, no include_str!/include_bytes!). Cargo.lock must be listed
# explicitly because `include` replaces the default VCS walk, and `cargo install --locked`
# needs it. Every pattern is anchored with a leading "/": these are gitignore-style
# globs, so an unanchored "LICENSE" would also match web/node_modules/**/LICENSE.
include = [
  "/src/**/*.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE",
  "/readme.md",
  "/Pseudolang.md",
]

[lib]
name = "fpli_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fpli"
path = "src/main.rs"

[package.metadata.wasm-pack]
profile.release.wasm-opt = false

[package.metadata.deb]
name = "pseudolang"
maintainer = "PseudoLang Software Foundation"
copyright = "2026 PseudoLang Software Foundation"
depends = "$auto"
section = "devel"
priority = "optional"
assets = [["target/release/fpli", "usr/bin/", "755"]]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
num-bigint = "0.5"
num-traits = "0.2"
num-integer = "0.1"
rand = "0.10"
chrono = { version = "0.4", optional = true }
chrono-tz = { version = "0.10", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = "0.4"
chrono-tz = "0.10"
stacker = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasi = { version = "0.11", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = ["native"]
native = ["chrono", "chrono-tz"]
wasm = ["wasm-bindgen", "console_error_panic_hook", "js-sys"]
wasi = ["dep:wasi", "chrono", "chrono-tz"]
