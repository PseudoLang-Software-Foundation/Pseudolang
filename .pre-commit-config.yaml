repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        args: ["--all", "--", "--check"]
      - id: clippy
        args: ["--all-targets", "--all-features", "--", "-D", "warnings"]

  - repo: local
    hooks:
      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        pass_filenames: false
        types: [rust]

      - id: taplo-fmt
        name: taplo fmt
        entry: taplo fmt --check
        language: system
        pass_filenames: false
        types: [toml]

      - id: tmlanguage-check
        name: tmLanguage up-to-date
        entry: bash -c 'bash scripts/tm/gen_tmlanguage.sh && git diff --exit-code utils/tm/pseudolang.tmLanguage.json'
        language: system
        pass_filenames: false
        files: \.(rs|sh)$

      - id: biome-check
        name: biome check
        entry: bash -c 'cd extensions/vscode && bun x biome check .'
        language: system
        pass_filenames: false
        files: extensions/vscode/
